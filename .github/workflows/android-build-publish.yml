name: Build and publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync-app/**'
      - '.github/workflows/android-build-publish.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: sync-app
        run: ./gradlew --no-daemon assembleDebug

      - name: Replace old APK and stage the new version
        shell: bash
        run: |
          set -euo pipefail
          info="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging sync-app/app/build/outputs/apk/debug/app-debug.apk | head -n 1)"
          version_name="$(python3 -c 'import re,sys; m=re.search(r"versionName=\x27([^\x27]+)\x27",sys.argv[1]); print(m.group(1))' "$info")"
          test -n "$version_name"
          rm -f Tod4S3-Sync-v*.apk
          cp sync-app/app/build/outputs/apk/debug/app-debug.apk "Tod4S3-Sync-v${version_name}.apk"
          sha256sum "Tod4S3-Sync-v${version_name}.apk"

      - name: Commit and push APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'Tod4S3-Sync-v*.apk'
          git rm -f --ignore-unmatch 'Tod4S3-Sync-v1.5.45.apk'
          if git diff --cached --quiet; then
            echo "APK is already current."
          else
            git commit -m "Publish Android APK v1.5.46"
            git push
          fi
